name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      target_sha:
        description: 'CIが成功したデプロイ候補の完全なコミットSHA'
        required: true
        type: string

# デフォルトですべてのGITHUB_TOKEN権限を無効化
permissions: {}

# ==========================================
# デプロイの同時実行を防止
# ==========================================
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ==========================================
  # デプロイ対象SHAの確定
  # ==========================================
  resolve-deployment-target:
    name: Resolve Deployment Target
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: >
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.name == 'CI' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )

    permissions:
      actions: read
      contents: read

    outputs:
      target_sha: ${{ steps.resolve-auto.outputs.target_sha || steps.resolve-manual.outputs.target_sha }}

    steps:
      # ------------------------------------------
      # CI成功後の自動実行
      # ------------------------------------------
      - name: Resolve automatic deployment target
        id: resolve-auto
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid CI commit SHA."
            exit 1
          fi

          echo "Checking the latest main commit..."

          MAIN_SHA=$(gh api \
            "repos/${GH_REPO}/commits/main" \
            --jq '.sha')

          if [[ "$TARGET_SHA" != "$MAIN_SHA" ]]; then
            echo "Deployment skipped: the successful CI commit is no longer the latest main commit."
            echo "CI SHA: $TARGET_SHA"
            echo "Main SHA: $MAIN_SHA"
            exit 1
          fi

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "## Automatic Deployment Candidate"
            echo ""
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- CI Run ID: \`$CI_RUN_ID\`"
            echo "- CI Run Number: \`$CI_RUN_NUMBER\`"
            echo "- Latest main commit: CONFIRMED"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------
      # 手動実行
      # ------------------------------------------
      - name: Validate manual target SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid SHA. Please provide a full 40-character commit SHA."
            exit 1
          fi

          echo "Target SHA format is valid."

      - name: Verify successful CI run
        id: resolve-manual
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          echo "Checking CI results for the specified commit..."

          RUN_JSON=$(gh api \
            --method GET \
            "repos/${GH_REPO}/actions/workflows/ci.yml/runs" \
            -f head_sha="$TARGET_SHA" \
            -f branch=main \
            -f event=push \
            -F per_page=100)

          LATEST_RUN=$(jq -cer \
            --arg target_sha "$TARGET_SHA" \
            '[
              .workflow_runs[]
              | select(.head_sha == $target_sha)
              | select(.head_branch == "main")
              | select(.event == "push")
              | select(.name == "CI")
            ]
            | sort_by([.run_number, .run_attempt])
            | last
            | select(
                .status == "completed" and
                .conclusion == "success"
              )' <<< "$RUN_JSON")

          RUN_ID=$(jq -r '.id' <<< "$LATEST_RUN")
          RUN_NUMBER=$(jq -r '.run_number' <<< "$LATEST_RUN")
          RUN_SHA=$(jq -r '.head_sha' <<< "$LATEST_RUN")
          RUN_URL=$(jq -r '.html_url' <<< "$LATEST_RUN")

          if [[ "$RUN_SHA" != "$TARGET_SHA" ]]; then
            echo "CI SHA does not match the requested SHA."
            exit 1
          fi

          echo "target_sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "## Manual Deployment Candidate"
            echo ""
            echo "- Target SHA: \`$RUN_SHA\`"
            echo "- CI Run ID: \`$RUN_ID\`"
            echo "- CI Run Number: \`$RUN_NUMBER\`"
            echo "- CI Result: SUCCESS"
            echo "- CI URL: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================
  # 本番デプロイ前の事前チェック
  # ==========================================
  production-preflight:
    name: Production Preflight
    runs-on: ubuntu-latest
    needs: resolve-deployment-target
    timeout-minutes: 15

    if: needs.resolve-deployment-target.result == 'success'

    permissions:
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: i-031ad3c8225459f7b
      TARGET_SHA: ${{ needs.resolve-deployment-target.outputs.target_sha }}

    steps:
      # ------------------------------------------
      # AWS OIDC認証
      # ------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "Verifying AWS identity..."
          aws sts get-caller-identity

      # ------------------------------------------
      # SSM経由の読み取り専用事前チェック
      # ------------------------------------------
      - name: Run production preflight checks
        env:
          PREFLIGHT_SCRIPT: |
            set -euo pipefail

            APP_DIR="/home/ssm-user/vue-laravel-spa"
            PROJECT="vue-laravel-spa"

            echo "===== Production Preflight ====="
            echo "Check mode: READ ONLY"
            echo ""

            if [[ ! -d "$APP_DIR" ]]; then
              echo "Application directory not found."
              exit 1
            fi

            cd "$APP_DIR"

            echo "===== Git ====="
            git -c safe.directory="$APP_DIR" -C "$APP_DIR" rev-parse HEAD

            if [[ -z "$(git -c safe.directory="$APP_DIR" -C "$APP_DIR" status --short)" ]]; then
              echo "Working tree: CLEAN"
            else
              echo "Working tree: CHANGES DETECTED"
              git -c safe.directory="$APP_DIR" -C "$APP_DIR" status --short
            fi

            echo "Production HEAD SHA:"
            git -c safe.directory="$APP_DIR" -C "$APP_DIR" rev-parse HEAD
            echo ""

            echo "===== Compose Configuration ====="
            docker compose -p "$PROJECT" -f compose.prod.yml config --quiet
            echo "Compose configuration: OK"
            echo ""

            echo "===== Compose Services ====="
            docker compose -p "$PROJECT" -f compose.prod.yml ps
            echo ""

            echo "===== Upload Volumes ====="
            for volume in \
              vue-laravel-spa_public_file_uploads \
              vue-laravel-spa_public_user_uploads \
              vue-laravel-spa_public_dummy_uploads \
              vue-laravel-spa_public_item_uploads \
              vue-laravel-spa_public_outfit_uploads
            do
              docker volume inspect "$volume" >/dev/null
              echo "$volume: OK"
            done
            echo ""

            echo "===== Production Images ====="
            docker image inspect daily-outfit-app:latest \
              --format 'daily-outfit-app:latest {{.Id}}'
            docker image inspect daily-outfit-nginx:latest \
              --format 'daily-outfit-nginx:latest {{.Id}}'
            echo ""

            echo "===== Disk ====="
            df -h /
            echo ""

            echo "===== Memory ====="
            free -h
            echo ""

            echo "===== Preflight Completed ====="
            echo "No deployment, build, restart, migration, or volume operation was performed."

        run: |
          set -euo pipefail

          if [[ -z "$TARGET_SHA" || ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Validated target SHA is missing or invalid."
            exit 1
          fi

          echo "Validated deployment candidate: $TARGET_SHA"
          echo "Target EC2: $EC2_INSTANCE_ID"
          echo "Sending read-only preflight command..."

          PARAMETERS=$(jq -n \
            --arg script "$PREFLIGHT_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Read-only production preflight for ${TARGET_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "Failed to obtain SSM command ID."
            exit 1
          fi

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)

            if [[ -n "$RESULT" ]]; then
              STATUS=$(jq -r '.Status // "Unknown"' <<< "$RESULT")

              if [[ "$STATUS" == "Success" ]]; then
                echo ""
                echo "===== EC2 Preflight Output ====="
                jq -r '.StandardOutputContent // ""' <<< "$RESULT"

                {
                  echo "## Production Preflight"
                  echo ""
                  echo "- Target SHA: \`$TARGET_SHA\`"
                  echo "- EC2 Instance: \`$EC2_INSTANCE_ID\`"
                  echo "- SSM Status: SUCCESS"
                  echo "- Production deployment: NOT executed"
                } >> "$GITHUB_STEP_SUMMARY"

                exit 0
              fi

              case "$STATUS" in
                Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                  echo "SSM command failed. Status: $STATUS"
                  echo ""
                  echo "===== Standard Output ====="
                  jq -r '.StandardOutputContent // ""' <<< "$RESULT"
                  echo ""
                  echo "===== Standard Error ====="
                  jq -r '.StandardErrorContent // ""' <<< "$RESULT"
                  exit 1
                  ;;
              esac
            fi

            echo "Waiting for SSM command... ($attempt/60)"
            sleep 5
          done

          echo "Timed out while waiting for SSM command."
          exit 1

  # ==========================================
  # 本番デプロイ
  # ==========================================
  production-deploy:
    name: Production Deploy
    runs-on: ubuntu-latest

    environment:
      name: production

    needs:
      - resolve-deployment-target
      - production-preflight
    timeout-minutes: 45

    if: >
      needs.resolve-deployment-target.result == 'success' &&
      needs.production-preflight.result == 'success'

    permissions:
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: i-031ad3c8225459f7b
      TARGET_SHA: ${{ needs.resolve-deployment-target.outputs.target_sha }}
      DEPLOY_MODE: ${{ github.event_name }}

    steps:
      # ------------------------------------------
      # AWS OIDC認証
      # ------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          aws sts get-caller-identity

      # ------------------------------------------
      # SSM経由でEC2デプロイスクリプトを実行
      # ------------------------------------------
      - name: Deploy production release
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment SHA."
            exit 1
          fi

          if [[ "$DEPLOY_MODE" != "workflow_run" && "$DEPLOY_MODE" != "workflow_dispatch" ]]; then
            echo "Invalid deployment mode."
            exit 1
          fi

          echo "Target SHA: $TARGET_SHA"
          echo "Deployment mode: $DEPLOY_MODE"
          echo "Target EC2: $EC2_INSTANCE_ID"

          # SHAは40文字の16進数、DEPLOY_MODEは固定値として検証済み
          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/home/ssm-user/vue-laravel-spa"
          TARGET_SHA="__TARGET_SHA__"
          DEPLOY_MODE="__DEPLOY_MODE__"
          RUNNER_SCRIPT="/tmp/deploy-production-${TARGET_SHA}.sh"

          if [[ ! -d "$APP_DIR/.git" ]]; then
            echo "Production Git repository not found."
            exit 1
          fi

          if [[ ! -f "$APP_DIR/.env" ]]; then
            echo "Production environment file not found."
            exit 1
          fi

          echo "===== Fetch Deployment Candidate ====="

          git -c safe.directory="$APP_DIR" -C "$APP_DIR" fetch \
            --no-tags origin \
            refs/heads/main:refs/remotes/origin/main

          git -c safe.directory="$APP_DIR" -C "$APP_DIR" cat-file -e "${TARGET_SHA}^{commit}"

          # 自動デプロイでは古いCIイベントによる巻き戻しを防止
          if [[ "$DEPLOY_MODE" == "workflow_run" ]]; then
            MAIN_SHA=$(git -c safe.directory="$APP_DIR" -C "$APP_DIR" rev-parse refs/remotes/origin/main)

            if [[ "$TARGET_SHA" != "$MAIN_SHA" ]]; then
              echo "Automatic deployment aborted: target is no longer the latest main commit."
              echo "Target SHA: $TARGET_SHA"
              echo "Main SHA: $MAIN_SHA"
              exit 1
            fi
          fi

          echo "===== Prepare Deployment Script ====="

          git -c safe.directory="$APP_DIR" -C "$APP_DIR" show \
            "${TARGET_SHA}:scripts/deploy-production.sh" > "$RUNNER_SCRIPT"

          if [[ ! -s "$RUNNER_SCRIPT" ]]; then
            echo "Deployment script is missing from the target commit."
            exit 1
          fi

          chmod 700 "$RUNNER_SCRIPT"
          trap 'rm -f "$RUNNER_SCRIPT"' EXIT

          echo "Deployment script retrieved from target commit."
          echo "Starting production deployment..."

          bash "$RUNNER_SCRIPT" "$TARGET_SHA"
          REMOTE
          )

          REMOTE_SCRIPT="${REMOTE_SCRIPT//__TARGET_SHA__/$TARGET_SHA}"
          REMOTE_SCRIPT="${REMOTE_SCRIPT//__DEPLOY_MODE__/$DEPLOY_MODE}"

          PARAMETERS=$(jq -n \
            --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Production deployment for ${TARGET_SHA}" \
            --timeout-seconds 1800 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "Failed to obtain SSM command ID."
            exit 1
          fi

          echo "SSM Command ID: $COMMAND_ID"

          # デプロイ完了を最大30分待機
          for attempt in $(seq 1 180); do
            RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)

            if [[ -n "$RESULT" ]]; then
              STATUS=$(jq -r '.Status // "Unknown"' <<< "$RESULT")

              if [[ "$STATUS" == "Success" ]]; then
                echo ""
                echo "===== Production Deployment Output ====="
                jq -r '.StandardOutputContent // ""' <<< "$RESULT"

                {
                  echo "## Production Deployment"
                  echo ""
                  echo "- Target SHA: \`$TARGET_SHA\`"
                  echo "- EC2 Instance: \`$EC2_INSTANCE_ID\`"
                  echo "- SSM Status: SUCCESS"
                } >> "$GITHUB_STEP_SUMMARY"

                exit 0
              fi

              case "$STATUS" in
                Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                  echo "Production deployment failed. SSM Status: $STATUS"
                  echo ""
                  echo "===== Standard Output ====="
                  jq -r '.StandardOutputContent // ""' <<< "$RESULT"
                  echo ""
                  echo "===== Standard Error ====="
                  jq -r '.StandardErrorContent // ""' <<< "$RESULT"
                  exit 1
                  ;;
              esac
            fi

            echo "Waiting for deployment... ($attempt/180)"
            sleep 10
          done

          echo "Timed out while waiting for production deployment."
          exit 1
