name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      target_sha:
        description: 'CIが成功したデプロイ候補の完全なコミットSHA'
        required: true
        type: string

# デフォルトですべてのGITHUB_TOKEN権限を無効化
permissions: {}

jobs:
  # ==========================================
  # CI成功イベントの検知
  # ==========================================
  detect-ci-success:
    name: Detect Successful CI
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Validate CI commit SHA
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail

          if [[ ! "$CI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit SHA."
            exit 1
          fi

          echo "CI completed successfully."
          echo "Branch: $CI_BRANCH"
          echo "Event: $CI_EVENT"
          echo "Commit SHA: $CI_SHA"
          echo "CI Run ID: $CI_RUN_ID"
          echo "CI Run Number: $CI_RUN_NUMBER"

          {
            echo "## CI Success Detected"
            echo ""
            echo "- Branch: \`$CI_BRANCH\`"
            echo "- Event: \`$CI_EVENT\`"
            echo "- Commit SHA: \`$CI_SHA\`"
            echo "- CI Run ID: \`$CI_RUN_ID\`"
            echo "- CI Run Number: \`$CI_RUN_NUMBER\`"
            echo ""
            echo "Production deployment has NOT been executed."
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================
  # 手動実行時の対象SHA・CI成功確認
  # ==========================================
  validate-deployment-candidate:
    name: Validate Deployment Candidate
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'

    permissions:
      actions: read

    outputs:
      target_sha: ${{ steps.verify-ci.outputs.target_sha }}

    steps:
      - name: Validate SHA format
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid SHA. Please provide a full 40-character commit SHA."
            exit 1
          fi

          echo "Target SHA format is valid."

      - name: Verify successful CI run
        id: verify-ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          echo "Checking CI results for the specified commit..."

          RUN_JSON=$(gh api \
            --method GET \
            "repos/${GH_REPO}/actions/workflows/ci.yml/runs" \
            -f head_sha="$TARGET_SHA" \
            -f branch=main \
            -f event=push \
            -F per_page=100)

          LATEST_RUN=$(jq -cer \
            --arg target_sha "$TARGET_SHA" \
            '[
              .workflow_runs[]
              | select(.head_sha == $target_sha)
              | select(.head_branch == "main")
              | select(.event == "push")
              | select(.name == "CI")
            ]
            | sort_by(.run_number)
            | last
            | select(
                .status == "completed" and
                .conclusion == "success"
              )' <<< "$RUN_JSON")

          RUN_ID=$(jq -r '.id' <<< "$LATEST_RUN")
          RUN_NUMBER=$(jq -r '.run_number' <<< "$LATEST_RUN")
          RUN_SHA=$(jq -r '.head_sha' <<< "$LATEST_RUN")
          RUN_URL=$(jq -r '.html_url' <<< "$LATEST_RUN")

          if [[ "$RUN_SHA" != "$TARGET_SHA" ]]; then
            echo "CI SHA does not match the requested SHA."
            exit 1
          fi

          echo "Successful CI run found."
          echo "Commit SHA: $RUN_SHA"
          echo "CI Run ID: $RUN_ID"
          echo "CI Run Number: $RUN_NUMBER"
          echo "CI URL: $RUN_URL"

          # 検証済みSHAを後続ジョブへ渡す
          echo "target_sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "## Deployment Candidate Validation"
            echo ""
            echo "- Target SHA: \`$RUN_SHA\`"
            echo "- CI Run ID: \`$RUN_ID\`"
            echo "- CI Run Number: \`$RUN_NUMBER\`"
            echo "- CI Result: SUCCESS"
            echo "- CI URL: $RUN_URL"
            echo ""
            echo "Candidate validation completed."
            echo "Production deployment has NOT been executed."
          } >> "$GITHUB_STEP_SUMMARY"

  # 本番デプロイ前の事前チェック
  production-preflight:
    name: Production Preflight
    runs-on: ubuntu-latest
    needs: validate-deployment-candidate
    timeout-minutes: 15

    # 手動実行かつSHA検証成功時のみ実行
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.validate-deployment-candidate.result == 'success'

    permissions:
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: i-031ad3c8225459f7b
      TARGET_SHA: ${{ needs.validate-deployment-candidate.outputs.target_sha }}

    steps:
      # AWS OIDC認証
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          echo "Verifying AWS identity..."
          aws sts get-caller-identity

      # SSM経由で本番EC2を読み取り専用確認
      - name: Run production preflight checks
        env:
          PREFLIGHT_SCRIPT: |
            set -euo pipefail

            APP_DIR="/home/ssm-user/vue-laravel-spa"
            PROJECT="vue-laravel-spa"

            echo "===== Production Preflight ====="
            echo "Check mode: READ ONLY"
            echo ""

            # 作業ディレクトリ確認
            if [[ ! -d "$APP_DIR" ]]; then
              echo "Application directory not found."
              exit 1
            fi

            cd "$APP_DIR"

            # Git状態確認
            echo "===== Git ====="
            git -c safe.directory="$APP_DIR" -C "$APP_DIR" rev-parse HEAD
            git -c safe.directory="$APP_DIR" -C "$APP_DIR" status --short
            echo ""

            # Compose設定の構文確認
            echo "===== Compose Configuration ====="
            docker compose -p "$PROJECT" -f compose.prod.yml config --quiet
            echo "Compose configuration: OK"
            echo ""

            # Compose稼働状態
            echo "===== Compose Services ====="
            docker compose -p "$PROJECT" -f compose.prod.yml ps
            echo ""

            # 既存アップロード用ボリューム確認
            echo "===== Upload Volumes ====="
            for volume in \
              vue-laravel-spa_public_file_uploads \
              vue-laravel-spa_public_user_uploads \
              vue-laravel-spa_public_dummy_uploads \
              vue-laravel-spa_public_item_uploads \
              vue-laravel-spa_public_outfit_uploads
            do
              docker volume inspect "$volume" >/dev/null
              echo "$volume: OK"
            done
            echo ""

            # 現在の本番イメージ確認
            echo "===== Production Images ====="
            docker image inspect daily-outfit-app:latest \
              --format 'daily-outfit-app:latest {{.Id}}'
            docker image inspect daily-outfit-nginx:latest \
              --format 'daily-outfit-nginx:latest {{.Id}}'
            echo ""

            # ディスク・メモリ確認
            echo "===== Disk ====="
            df -h /
            echo ""

            echo "===== Memory ====="
            free -h
            echo ""

            echo "===== Preflight Completed ====="
            echo "No deployment, build, restart, migration, or volume operation was performed."

          run: |
            set -euo pipefail

            if [[ -z "$TARGET_SHA" || ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Validated target SHA is missing or invalid."
              exit 1
            fi

            echo "Validated deployment candidate: $TARGET_SHA"
            echo "Target EC2: $EC2_INSTANCE_ID"
            echo "Sending read-only preflight command..."

            PARAMETERS=$(jq -n \
              --arg script "$PREFLIGHT_SCRIPT" \
              '{commands: [$script]}')

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Read-only production preflight for ${TARGET_SHA}" \
              --parameters "$PARAMETERS" \
              --query 'Command.CommandId' \
              --output text)

            if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
              echo "Failed to obtain SSM command ID."
              exit 1
            fi

            echo "SSM Command ID: $COMMAND_ID"

            # SSMコマンドの完了を最大5分待機
            for attempt in $(seq 1 60); do
              RESULT=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --output json 2>/dev/null || true)

              if [[ -n "$RESULT" ]]; then
                STATUS=$(jq -r '.Status // "Unknown"' <<< "$RESULT")

                if [[ "$STATUS" == "Success" ]]; then
                  echo ""
                  echo "===== EC2 Preflight Output ====="
                  jq -r '.StandardOutputContent // ""' <<< "$RESULT"

                  echo "===== SSM Status ====="
                  echo "$STATUS"

                  {
                    echo "## Production Preflight"
                    echo ""
                    echo "- Target SHA: \`$TARGET_SHA\`"
                    echo "- EC2 Instance: \`$EC2_INSTANCE_ID\`"
                    echo "- SSM Status: SUCCESS"
                    echo "- Production deployment: NOT executed"
                    echo ""
                    echo "Read-only production checks completed."
                  } >> "$GITHUB_STEP_SUMMARY"

                  exit 0
                fi

                if [[ "$STATUS" == "Failed" ||
                      "$STATUS" == "Cancelled" ||
                      "$STATUS" == "TimedOut" ]]; then
                  echo "SSM command failed. Status: $STATUS"
                  echo ""
                  echo "===== Standard Output ====="
                  jq -r '.StandardOutputContent // ""' <<< "$RESULT"
                  echo ""
                  echo "===== Standard Error ====="
                  jq -r '.StandardErrorContent // ""' <<< "$RESULT"
                  exit 1
                fi
              fi

              echo "Waiting for SSM command... ($attempt/60)"
              sleep 5
            done

            echo "Timed out while waiting for SSM command."
            exit 1
