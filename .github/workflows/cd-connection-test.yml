name: CD Connection Test

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  connection-test:
    name: AWS OIDC and SSM Connection Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity > /dev/null
          echo "AWS OIDC authentication successful."

      - name: Send SSM command
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-031ad3c8225459f7b \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["hostname"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command sent successfully."

      - name: Wait for SSM result
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          for attempt in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-031ad3c8225459f7b \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: ${STATUS:-Waiting}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-031ad3c8225459f7b \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-031ad3c8225459f7b \
                  --query 'StatusDetails' \
                  --output text
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "SSM command timed out."
          exit 1
